<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0f1419"/>
<title>Pós-evento · Chefe de bar</title>
<style>
  :root {
    --bg: #0f1419; --card: #1a222c; --card2: #232d3a; --border: #2e3a4a;
    --text: #f2f5f8; --muted: #9aa8b8; --accent: #e8a838; --accent2: #3d8bfd;
    --ok: #2ecc71; --danger: #e74c3c; --radius: 14px; --pad: 16px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; }
  body { padding: 0 0 120px; min-height: 100dvh; }
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(180deg, #151c24 0%, #151c24ee 80%, transparent);
    padding: 14px var(--pad) 18px; backdrop-filter: blur(8px);
  }
  .badge { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--accent); background: #e8a83822; border: 1px solid #e8a83855;
    padding: 4px 10px; border-radius: 999px; margin-bottom: 8px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; line-height: 1.3; }
  .meta { color: var(--muted); font-size: .9rem; }
  .meta strong { color: var(--text); font-weight: 600; }
  main { padding: 0 var(--pad); display: flex; flex-direction: column; gap: 14px; }
  section.card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; }
  section.card h2 {
    margin: 0 0 12px; font-size: .78rem; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .person {
    background: var(--card2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .person:last-child { margin-bottom: 0; }
  .person-name { font-weight: 600; font-size: 1rem; margin-bottom: 10px; }
  label { display: block; font-size: .75rem; color: var(--muted); margin: 8px 0 4px; }
  input[type="text"], input[type="number"], input[type="time"], textarea, select {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 12px; font-size: 16px; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent2); }
  textarea { min-height: 72px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button {
    appearance: none; border: 1px solid var(--border); background: var(--bg);
    color: var(--muted); border-radius: 10px; padding: 12px; font-size: .95rem; font-weight: 600; }
  .seg button.on-yes { background: #2ecc7122; border-color: var(--ok); color: var(--ok); }
  .seg button.on-no { background: #e74c3c22; border-color: var(--danger); color: var(--danger); }
  .fields-extra { display: none; margin-top: 4px; }
  .fields-extra.show { display: block; }
  .toggle-block { display: none; }
  .toggle-block.show { display: block; }
  .add-btn, .remove-btn {
    appearance: none; width: 100%; margin-top: 8px;
    border: 1px dashed var(--border); background: transparent;
    color: var(--accent2); border-radius: 10px; padding: 12px; font-size: .95rem; font-weight: 600; }
  .remove-btn { color: var(--danger); border-style: solid; margin-top: 6px; width: auto; padding: 8px 12px; }
  .extra-item { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 12px var(--pad) calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, #0f1419 70%, transparent);
  }
  .submit {
    width: 100%; appearance: none; border: none;
    background: var(--accent); color: #1a1205;
    font-weight: 700; font-size: 1.05rem; padding: 16px;
    border-radius: 14px; box-shadow: 0 8px 24px #e8a83833; }
  .submit:active { transform: scale(.98); }
  .proto-note { font-size: .75rem; color: var(--muted); text-align: center; margin-top: 8px; }
  .done {
    display: none; position: fixed; inset: 0; background: #0f1419f2;
    z-index: 50; padding: var(--pad); align-items: center; justify-content: center; flex-direction: column;
    text-align: center; }
  .done.show { display: flex; }
  .done h2 { color: var(--ok); margin: 0 0 8px; }
  .done pre {
    text-align: left; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; max-height: 40vh; overflow: auto;
    font-size: 11px; width: 100%; color: var(--muted); }
  .done .actions { display: flex; gap: 8px; width: 100%; margin-top: 12px; }
  .done .actions button {
    flex: 1; appearance: none; border: 1px solid var(--border);
    background: var(--card); color: var(--text); border-radius: 12px;
    padding: 14px; font-weight: 600; }
  .done .actions button.primary { background: var(--accent); color: #1a1205; border: none; }
</style>
</head>
<body>
<header>
  <span class="badge">Protótipo · Chefe de bar</span>
  <h1 id="titulo"></h1>
  <div class="meta"><strong id="local"></strong> · <span id="data"></span></div>
</header>
<main>
  <section class="card">
    <h2>Equipe escalada</h2>
    <div id="equipe"></div>
  </section>
  <section class="card">
    <h2>Profissional fora da lista?</h2>
    <div class="seg" id="fora-seg">
      <button type="button" data-v="nao" class="on-no">Não</button>
      <button type="button" data-v="sim">Sim</button>
    </div>
    <div class="toggle-block" id="fora-block">
      <div id="extras"></div>
      <button type="button" class="add-btn" id="add-extra">+ Adicionar profissional</button>
    </div>
  </section>
  <section class="card">
    <h2>Reembolsos</h2>
    <div class="seg" id="reemb-seg">
      <button type="button" data-v="nao" class="on-no">Não</button>
      <button type="button" data-v="sim">Sim</button>
    </div>
    <div class="toggle-block" id="reemb-block">
      <label>Quem / o quê / valor</label>
      <textarea id="reemb-detalhe" placeholder="Ex.: Alyne — Uber R$ 45"></textarea>
    </div>
  </section>
  <section class="card">
    <h2>Hora extra</h2>
    <div class="seg" id="he-seg">
      <button type="button" data-v="nao" class="on-no">Não</button>
      <button type="button" data-v="sim">Sim</button>
    </div>
    <div class="toggle-block" id="he-block">
      <div class="row">
        <div>
          <label>Quantas horas</label>
          <input type="number" id="he-horas" min="0" step="0.5" placeholder="Ex.: 2"/>
        </div>
        <div>
          <label>Valor da hora (R$)</label>
          <input type="number" id="he-valor" min="0" step="0.01" placeholder="Ex.: 50"/>
        </div>
      </div>
      <label>Quem solicitou</label>
      <input type="text" id="he-solicitou" placeholder="Nome de quem pediu"/>
      <label>Quem fez a hora extra</label>
      <input type="text" id="he-quem" placeholder="Nome(s)"/>
    </div>
  </section>
</main>
<footer>
  <button type="button" class="submit" id="enviar">Enviar pós-evento</button>
  <div class="proto-note">Protótipo — ainda não grava na planilha</div>
</footer>
<div class="done" id="done">
  <h2>✓ Recebido</h2>
  <p style="color:var(--muted);margin:0 0 12px">Resumo (protótipo)</p>
  <pre id="resumo"></pre>
  <div class="actions">
    <button type="button" id="copiar">Copiar</button>
    <button type="button" class="primary" id="fechar">Ok</button>
  </div>
</div>
<script>
const EVENT = {"titulo": "15 anos — Fernanda (mãe Nicha)", "local": "CENTRAL HALL", "data": "25/09/2026", "empresa": "THE BARTENDERS", "fonte": "RH/EVENTOS_4_SEMANA_SETEMBRO_TB · aba 1", "profissionais": [{"nome": "Guilherme Marodin"}, {"nome": "Guilherme da Rosa Ramos"}, {"nome": "Thaiane Franciscon Machado"}, {"nome": "Gabrielly Allanis Martins Witajewski"}, {"nome": "Marcelo Garcia Roman Júnior"}, {"nome": "Alyne Fernanda Otto"}]};
document.getElementById('titulo').textContent = EVENT.titulo;
document.getElementById('local').textContent = EVENT.local;
document.getElementById('data').textContent = EVENT.data;
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const equipeEl = document.getElementById('equipe');
EVENT.profissionais.forEach((p, i) => {
  const div = document.createElement('div');
  div.className = 'person';
  div.dataset.i = i;
  div.innerHTML = `
    <div class="person-name">${esc(p.nome)}</div>
    <label>Compareceu?</label>
    <div class="seg compareceu">
      <button type="button" data-v="sim">Sim</button>
      <button type="button" data-v="nao">Não</button>
    </div>
    <div class="fields-extra present-fields">
      <div class="row">
        <div><label>Chegada</label><input type="time" class="chegada"/></div>
        <div><label>Saída</label><input type="time" class="saida"/></div>
      </div>
      <label>Feedback</label>
      <textarea class="feedback" placeholder="Pontualidade, postura, desempenho…"></textarea>
    </div>
    <div class="fields-extra absent-fields">
      <label>Motivo / observação</label>
      <textarea class="motivo" placeholder="Avisou? Substituto?"></textarea>
    </div>`;
  equipeEl.appendChild(div);
});
function wireSeg(container, onChange) {
  const buttons = container.querySelectorAll('button');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('on-yes', 'on-no'));
      btn.classList.add(btn.dataset.v === 'sim' ? 'on-yes' : 'on-no');
      onChange(btn.dataset.v);
    });
  });
}
document.querySelectorAll('.person').forEach(person => {
  wireSeg(person.querySelector('.compareceu'), v => {
    person.querySelector('.present-fields').classList.toggle('show', v === 'sim');
    person.querySelector('.absent-fields').classList.toggle('show', v === 'nao');
    person.dataset.compareceu = v;
  });
});
function wireYesNo(segId, blockId) {
  const state = { v: 'nao' };
  wireSeg(document.getElementById(segId), v => {
    state.v = v;
    document.getElementById(blockId).classList.toggle('show', v === 'sim');
  });
  return state;
}
const fora = wireYesNo('fora-seg', 'fora-block');
const reemb = wireYesNo('reemb-seg', 'reemb-block');
const he = wireYesNo('he-seg', 'he-block');
const extrasEl = document.getElementById('extras');
document.getElementById('add-extra').addEventListener('click', () => {
  const item = document.createElement('div');
  item.className = 'extra-item';
  item.innerHTML = `
    <label>Nome</label><input type="text" class="ex-nome" placeholder="Nome completo"/>
    <div class="row">
      <div><label>Chegada</label><input type="time" class="ex-chegada"/></div>
      <div><label>Saída</label><input type="time" class="ex-saida"/></div>
    </div>
    <label>Feedback</label><textarea class="ex-feedback"></textarea>
    <button type="button" class="remove-btn">Remover</button>`;
  item.querySelector('.remove-btn').addEventListener('click', () => item.remove());
  extrasEl.appendChild(item);
});
document.getElementById('enviar').addEventListener('click', () => {
  const equipe = [];
  document.querySelectorAll('.person').forEach((person, i) => {
    const p = EVENT.profissionais[i];
    equipe.push({
      nome: p.nome,
      compareceu: person.dataset.compareceu || null,
      chegada: person.querySelector('.chegada').value || null,
      saida: person.querySelector('.saida').value || null,
      feedback: person.querySelector('.feedback').value.trim() || null,
      motivoAusencia: person.querySelector('.motivo').value.trim() || null,
    });
  });
  const extras = [...extrasEl.querySelectorAll('.extra-item')].map(el => ({
    nome: el.querySelector('.ex-nome').value.trim(),
    chegada: el.querySelector('.ex-chegada').value || null,
    saida: el.querySelector('.ex-saida').value || null,
    feedback: el.querySelector('.ex-feedback').value.trim() || null,
  })).filter(x => x.nome);
  if (equipe.some(p => !p.compareceu)) {
    alert('Marque se cada profissional compareceu (Sim/Não).');
    return;
  }
  const payload = {
    evento: { titulo: EVENT.titulo, local: EVENT.local, data: EVENT.data },
    equipe,
    profissionaisExtras: fora.v === 'sim' ? extras : [],
    reembolsos: reemb.v === 'sim'
      ? { teve: true, detalhe: document.getElementById('reemb-detalhe').value.trim() }
      : { teve: false },
    horaExtra: he.v === 'sim' ? {
      teve: true,
      horas: document.getElementById('he-horas').value || null,
      valorHora: document.getElementById('he-valor').value || null,
      solicitou: document.getElementById('he-solicitou').value.trim() || null,
      quemFez: document.getElementById('he-quem').value.trim() || null,
    } : { teve: false },
    preenchidoEm: new Date().toISOString(),
  };
  document.getElementById('resumo').textContent = JSON.stringify(payload, null, 2);
  document.getElementById('done').classList.add('show');
  window.__lastPayload = payload;
});
document.getElementById('copiar').addEventListener('click', async () => {
  const t = JSON.stringify(window.__lastPayload, null, 2);
  try { await navigator.clipboard.writeText(t); document.getElementById('copiar').textContent = 'Copiado!'; }
  catch { prompt('Copie:', t); }
});
document.getElementById('fechar').addEventListener('click', () => {
  document.getElementById('done').classList.remove('show');
});
</script>
</body>
</html>
